<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Magic City Helper</title>
    <style>
      body { width: 330px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #0d1118; color: #eef6ff; }
      label { display: block; margin: 10px 0 5px; color: #aeb8c7; font-size: 11px; font-weight: 700; text-transform: uppercase; }
      input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #354052; background: #070b12; color: #fff; }
      .configured-value { padding: 9px 0; color: #d9e5f3; overflow-wrap: anywhere; }
      button { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 9px; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #35d5ee, #76efc7); color: #061018; }
      button.secondary { border: 1px solid #354052; background: #171e29; color: #d9e5f3; }
      #status { margin-top: 12px; padding: 10px; border: 1px solid #354052; border-radius: 9px; color: #c5cfdd; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <strong id="extensionName">Custom Magic City Helper</strong>
    <label>Control plane</label>
    <div id="baseUrl" class="configured-value">Loading...</div>
    <label for="pairingCode">Pairing code</label>
    <input id="pairingCode" placeholder="ABCD-2345">
    <button id="pairBtn">Pair helper</button>
    <button id="permissionBtn" class="secondary">Grant configured site access</button>
    <button id="registerBtn">Register helper</button>
    <button id="pollBtn">Poll once</button>
    <div id="status">Not paired.</div>
    <script src="popup.js"></script>
  </body>
</html>
