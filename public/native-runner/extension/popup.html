<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic City Runner</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b12;
        color: #f5fbff;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: radial-gradient(circle at top right, rgba(117, 241, 204, 0.16), transparent 42%), #090b12;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 12px;
        color: rgba(205, 216, 231, 0.78);
        font-size: 12px;
        line-height: 1.45;
      }

      label {
        display: grid;
        gap: 5px;
        margin-top: 10px;
        color: rgba(222, 232, 244, 0.82);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(3, 7, 15, 0.78);
        color: #f8fcff;
        padding: 10px 11px;
        font: inherit;
        font-size: 13px;
        letter-spacing: 0;
        outline: none;
      }

      .code-input {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .actions.single {
        grid-template-columns: 1fr;
      }

      button {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: #f8fcff;
        min-height: 40px;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }

      button.primary {
        border: 0;
        color: #06101a;
        background: linear-gradient(135deg, #34d4ef, #7ff0c7);
      }

      .status {
        margin-top: 12px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(220, 232, 246, 0.9);
        font-size: 12px;
        line-height: 1.4;
        word-break: break-word;
      }

      details {
        margin-top: 10px;
      }

      summary {
        color: rgba(205, 216, 231, 0.76);
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Magic City Runner</h1>
    <p>Pair once, then Magic City can work in this signed-in Chrome profile. It pauses only for login, verification, or a policy mismatch.</p>

    <div id="pairingSetup">
      <label>
        Magic City URL
        <input id="baseUrl" value="https://magic-city.ai" autocomplete="off" />
      </label>

      <label>
        Pairing code
        <input id="pairingCode" class="code-input" placeholder="ABCD-2345" autocomplete="one-time-code" />
      </label>

      <div class="actions">
        <button id="pairBtn" class="primary">Pair</button>
        <button id="statusBtn">Status</button>
      </div>
    </div>

    <div id="missionActions" class="actions single" hidden>
      <button id="allowStartBtn" class="primary">Allow site and start</button>
    </div>

    <details id="advancedActions" hidden>
      <summary>Advanced</summary>
      <div class="actions single">
        <button id="runBtn">Run waiting mission</button>
      </div>
    </details>

    <div id="status" class="status">Not paired yet.</div>

    <script src="popup.js"></script>
  </body>
</html>
